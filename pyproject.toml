[project]
name = "tg-agent"
version = "0.1.0"
description = "ТГ-агент: управление ноутбуком Джесси из Telegram (мозг — claude CLI, руки — jarvis-computer)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
tg-agent = "tg_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_agent"]
